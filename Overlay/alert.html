<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat vs Streamer — Alerts</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw;
  height: 100vh;
  background: transparent;
  overflow: hidden;
  font-family: 'Space Mono', monospace;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

#alert {
  margin-top: 40px;
  min-width: 360px;
  max-width: 640px;
  background: #f4e8c1;
  border: 6px solid #5b3a21;
  border-radius: 12px;
  box-shadow: inset 0 0 0 3px #cf9f37, 0 8px 0 #3a2314, 0 14px 24px rgba(0,0,0,0.5);
  padding: 18px 26px;
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0;
  transform: translateY(-30px) scale(0.9);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

#alert.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.alert-icon {
  font-size: 40px;
  flex-shrink: 0;
}

.alert-body {
  min-width: 0;
}

.alert-title {
  font-family: 'Pixelify Sans', monospace;
  font-weight: 500;
  font-size: 20px;
  color: #3c2712;
  margin-bottom: 4px;
}

.alert-title b {
  color: #a23a26;
}

.alert-desc {
  font-size: 14px;
  color: #7a5a34;
  line-height: 1.4;
}

.alert-cost {
  font-size: 13px;
  color: #a67c1a;
  font-weight: 700;
  margin-top: 4px;
}
</style>
</head>
<body>

<div id="alert">
  <div class="alert-icon" id="alert-icon">🛒</div>
  <div class="alert-body">
    <div class="alert-title" id="alert-title"></div>
    <div class="alert-desc" id="alert-desc"></div>
    <div class="alert-cost" id="alert-cost" style="display:none"></div>
  </div>
</div>

<script>
const params  = new URLSearchParams(location.search);
const WS_PORT = params.get('port') || location.port || '7373';
const HOLD_MS = parseInt(params.get('hold') || '4500');

const ICONS  = { buy: '🛒', bits: '💰', donation: '💸', raid: '🚨' };
const LABELS = { buy: 'bought', bits: 'triggered with bits', donation: 'triggered with a donation', raid: 'triggered via raid' };

let queue   = [];
let showing = false;

function connect() {
  const ws = new WebSocket(`ws://localhost:${WS_PORT}/`);
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'feed') enqueue(msg);
    } catch (_) {}
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function enqueue(msg) {
  queue.push(msg);
  if (!showing) processQueue();
}

function processQueue() {
  if (!queue.length) { showing = false; return; }
  showing = true;

  const msg = queue.shift();
  render(msg);

  const el = document.getElementById('alert');
  requestAnimationFrame(() => el.classList.add('show'));

  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(processQueue, 400);
  }, HOLD_MS);
}

function render(msg) {
  document.getElementById('alert-icon').textContent = ICONS[msg.eventType] || '✨';
  document.getElementById('alert-title').innerHTML =
    `<b>${esc(msg.username)}</b> ${LABELS[msg.eventType] || 'triggered'} ${esc(msg.sabotageName || '')}`;
  document.getElementById('alert-desc').textContent = msg.description || '';

  const costEl = document.getElementById('alert-cost');
  if (msg.cost > 0) { costEl.style.display = ''; costEl.textContent = `${msg.cost}pts`; }
  else costEl.style.display = 'none';
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

connect();
</script>
</body>
</html>
