<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat vs Streamer — Alerts</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Space Mono', monospace;
  background-color: #2b2246;
  background-image: repeating-linear-gradient(90deg, #2b2246 0 62px, #201b38 62px 66px);
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ---- idle state ---- */

#idle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
  transition: opacity 0.4s ease;
}

#idle.hidden { display: none; }

.idle-sign {
  background: #f4e8c1;
  border: 6px solid #5b3a21;
  border-radius: 12px;
  box-shadow: inset 0 0 0 3px #cf9f37, 0 8px 0 #3a2314, 0 16px 28px rgba(0,0,0,0.5);
  padding: 28px 30px;
  max-width: 90vw;
}

.idle-title {
  font-family: 'Pixelify Sans', monospace;
  font-weight: 600;
  font-size: clamp(20px, 6vw, 30px);
  color: #3c2712;
  margin-bottom: 10px;
}

.idle-sub {
  font-size: clamp(12px, 3.4vw, 15px);
  color: #7a5a34;
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ---- active alert (stacked for a tall/narrow canvas) ---- */

#alert {
  display: none;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  width: min(90vw, 520px);
  background: #f4e8c1;
  border: 8px solid #5b3a21;
  border-radius: 16px;
  box-shadow: inset 0 0 0 4px #cf9f37, 0 10px 0 #3a2314, 0 20px 32px rgba(0,0,0,0.55);
  padding: clamp(24px, 6vw, 40px) clamp(20px, 5vw, 32px);
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

#alert.show {
  display: flex;
  opacity: 1;
  transform: scale(1);
}

.alert-icon {
  font-size: clamp(48px, 14vw, 84px);
  line-height: 1;
}

.alert-title {
  font-family: 'Pixelify Sans', monospace;
  font-weight: 600;
  font-size: clamp(18px, 5.5vw, 28px);
  color: #3c2712;
  word-break: break-word;
}

.alert-title b {
  display: block;
  color: #a23a26;
  font-size: clamp(22px, 7vw, 34px);
  margin-bottom: 4px;
}

.alert-desc {
  font-size: clamp(13px, 3.8vw, 17px);
  color: #7a5a34;
  line-height: 1.4;
  word-break: break-word;
}

.alert-cost {
  font-family: 'Space Mono', monospace;
  font-size: clamp(14px, 4vw, 18px);
  color: #a67c1a;
  font-weight: 700;
  background: #e8d59f;
  border: 2px solid #5b3a21;
  border-radius: 20px;
  padding: 4px 16px;
}
</style>
</head>
<body>

<div id="idle">
  <div class="idle-sign">
    <div class="idle-title">🌾 Chat vs Streamer</div>
    <div class="idle-sub">Waiting for chaos...</div>
  </div>
</div>

<div id="alert">
  <div class="alert-icon" id="alert-icon">🛒</div>
  <div class="alert-title" id="alert-title"></div>
  <div class="alert-desc" id="alert-desc"></div>
  <div class="alert-cost" id="alert-cost" style="display:none"></div>
</div>

<script>
const params  = new URLSearchParams(location.search);
const WS_PORT = params.get('port') || location.port || '7373';
const HOLD_MS = parseInt(params.get('hold') || '5000');

const ICONS  = { buy: '🛒', bits: '💰', donation: '💸', raid: '🚨' };
const LABELS = { buy: 'bought', bits: 'triggered with bits', donation: 'triggered with a donation', raid: 'triggered via raid' };

let queue   = [];
let showing = false;

function connect() {
  const ws = new WebSocket(`ws://localhost:${WS_PORT}/`);
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'feed') enqueue(msg);
    } catch (_) {}
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function enqueue(msg) {
  queue.push(msg);
  if (!showing) processQueue();
}

function processQueue() {
  if (!queue.length) {
    showing = false;
    document.getElementById('alert').classList.remove('show');
    document.getElementById('idle').classList.remove('hidden');
    return;
  }
  showing = true;
  document.getElementById('idle').classList.add('hidden');

  const msg = queue.shift();
  render(msg);

  const el = document.getElementById('alert');
  requestAnimationFrame(() => el.classList.add('show'));

  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(processQueue, 400);
  }, HOLD_MS);
}

function render(msg) {
  document.getElementById('alert-icon').textContent = ICONS[msg.eventType] || '✨';
  document.getElementById('alert-title').innerHTML =
    `<b>${esc(msg.username)}</b> ${LABELS[msg.eventType] || 'triggered'} ${esc(msg.sabotageName || '')}`;
  document.getElementById('alert-desc').textContent = msg.description || '';

  const costEl = document.getElementById('alert-cost');
  if (msg.cost > 0) { costEl.style.display = ''; costEl.textContent = `${msg.cost}pts`; }
  else costEl.style.display = 'none';
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

connect();
</script>
</body>
</html>
