<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chaos Shop — Twitch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --wood:      #5b3a21;
    --wood-deep: #3a2314;
    --gold-trim: #cf9f37;
    --parchment: #f4e8c1;
    --parchment-2: #e8d59f;
    --ink:       #3c2712;
    --muted:     #7a5a34;
    --green:     #3f8768;
    --red:       #a23a26;
    --gold:      #d8a52c;
    --blue:      #3c6e8f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    min-height: 587px;
    background: transparent;
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 28px;
    background: var(--wood);
    border-bottom: 4px solid var(--gold-trim);
    flex-shrink: 0;
  }

  .header svg { width: 28px; height: 28px; flex-shrink: 0; }

  .header-title {
    font-family: 'Pixelify Sans', monospace;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--parchment);
    text-shadow: 2px 2px 0 var(--wood-deep);
  }

  .header-sub {
    margin-left: auto;
    font-size: 13px;
    color: var(--parchment-2);
  }

  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--parchment);
  }

  .content-inner {
    padding: 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: autoscroll 40s linear infinite;
  }

  @keyframes autoscroll {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-60%); }
    50%  { transform: translateY(-60%); }
    90%  { transform: translateY(0); }
    100% { transform: translateY(0); }
  }

  .section {
    font-family: 'Pixelify Sans', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 0 2px;
  }

  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .shop-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--parchment-2);
    border: 2px solid var(--wood);
    border-radius: 5px;
    padding: 10px 16px;
    border-left: 5px solid var(--wood);
  }

  .shop-card.nuisance    { border-left-color: #8a8f6b; }
  .shop-card.disruptive  { border-left-color: var(--gold); }
  .shop-card.painful     { border-left-color: #c56a2e; }
  .shop-card.devastating { border-left-color: var(--red); }
  .shop-card.blessing    { border-left-color: var(--green); }
  .shop-card.tool        { border-left-color: var(--blue); }

  .shop-card.legendary   { border-left-color: var(--gold-trim); box-shadow: inset 0 0 0 1px var(--gold-trim); }

  .shop-card.on-cooldown { opacity: 0.45; }

  .card-cmd {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-cost {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .cd-txt {
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 28px;
    background: var(--wood);
    border-top: 4px solid var(--gold-trim);
    flex-shrink: 0;
  }

  .footer-text { font-size: 13px; color: var(--parchment-2); }
  .footer-cmd  {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--gold);
  }
</style>
</head>
<body>

  <div class="header">
    <!-- Twitch glitch logo -->
    <svg viewBox="0 0 24 24" fill="#cf9f37">
      <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
    </svg>
    <div class="header-title">CHAOS SHOP</div>
    <div class="header-sub">Use !buy &lt;command&gt; in Twitch chat</div>
  </div>

  <div class="content"><div class="content-inner" id="content">
    <div class="section">Connecting...</div>
  </div></div>

  <div class="footer">
    <div class="footer-text">Check your balance →</div>
    <div class="footer-cmd">!balance</div>
    <div class="footer-text">· Browse all →</div>
    <div class="footer-cmd">!shop</div>
    <div class="footer-text">· Details →</div>
    <div class="footer-cmd">!info &lt;command&gt;</div>
  </div>

<script>
const WS_PORT = new URLSearchParams(location.search).get('port') || location.port || '7373';
let shop = [], cdInterval = null;

const BLESSINGS = new Set([
  'sunny','restoreenergy','restorehealth','speedboost',
  'givegold','givemoregold','givemostgold',
  'watercrops','fertilize','cleardebris',
  'luckychant','payday','sugarrush','giftingtree',
  'autopetter','carepackage','airdrop',
  'upgraderandom','upgradeaxe','upgradepickaxe','upgradehoe','upgradewateringcan','upgraderod',
  'iridiumrandom','iridiumaxe','iridiumpickaxe','iridiumhoe','iridiumwateringcan','iridiumrod'
]);

const TIERS = [
  { label: '💀 Nuisance',    cls: 'nuisance',    min: 0,   max: 100,   blessingOnly: false },
  { label: '😈 Disruptive',  cls: 'disruptive',  min: 101, max: 250,   blessingOnly: false },
  { label: '💥 Painful',     cls: 'painful',     min: 251, max: 400,   blessingOnly: false },
  { label: '☠️ Devastating', cls: 'devastating', min: 401, max: 599,   blessingOnly: false },
  { label: '🌠 Legendary',   cls: 'legendary',   min: 600, max: 99999, blessingOnly: false },
  { label: '🌟 Blessings',   cls: 'blessing',    min: 0,   max: 99999, blessingOnly: true  },
];

function connect() {
  const ws = new WebSocket(`ws://localhost:${WS_PORT}/`);
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(_){} };
}

function handle(msg) {
  if (msg.type === 'init') {
    shop = msg.shop || []; render(); startCdTick();
  } else if (msg.type === 'shop_update') {
    (msg.shop || []).forEach(u => {
      const item = shop.find(s => s.buyCommand === u.buyCommand);
      if (item) {
        item.onCooldown = u.onCooldown;
        item.cooldownRemaining = u.cooldownRemaining;
        item.cooldownTotal = u.cooldownTotal || item.cooldownTotal;
      }
    });
    render();
  }
}

function render() {
  const content = document.getElementById('content');
  let html = '';
  TIERS.forEach(tier => {
    const items = shop.filter(i => {
      const isBlessing = BLESSINGS.has(i.buyCommand);
      if (tier.blessingOnly) return isBlessing;
      return !isBlessing && i.cost >= tier.min && i.cost <= tier.max;
    });
    if (!items.length) return;
    html += `<div class="section">${tier.label}</div><div class="shop-grid">`;
    items.forEach(i => {
      const right = i.onCooldown
        ? `<div class="cd-txt" id="ct-${esc(i.buyCommand)}">${i.cooldownRemaining}s</div>`
        : `<div class="card-cost">${i.cost}pts</div>`;
      html += `<div class="shop-card ${tier.cls}${i.onCooldown ? ' on-cooldown' : ''}">
        <div class="card-cmd">!buy ${esc(i.buyCommand)}</div>
        ${right}
      </div>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html || '<div class="section">No sabotages loaded.</div>';
}

function startCdTick() {
  if (cdInterval) clearInterval(cdInterval);
  cdInterval = setInterval(() => {
    let rerender = false;
    shop.forEach(i => {
      if (!i.onCooldown || i.cooldownRemaining <= 0) return;
      i.cooldownRemaining--;
      if (i.cooldownRemaining <= 0) { i.onCooldown = false; rerender = true; }
      else {
        const el = document.getElementById('ct-' + i.buyCommand);
        if (el) el.textContent = i.cooldownRemaining + 's';
      }
    });
    if (rerender) render();
  }, 1000);
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

connect();
</script>
</body>
</html>
